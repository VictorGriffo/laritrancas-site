<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Larissa Lima</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-admin.css">
</head>
<body>

<div class="admin-wrap">

  <section id="admin-login">
    <div class="admin-login-box">
      <div class="section-label">Área restrita</div>
      <h1>Painel de agendamentos</h1>
      <form id="admin-login-form">
        <div class="form-row">
          <label for="admin-email">E-mail</label>
          <input type="email" id="admin-email" required autocomplete="username">
        </div>
        <div class="form-row">
          <label for="admin-password">Senha</label>
          <input type="password" id="admin-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Entrar</button>
        <p id="admin-login-error" class="admin-error"></p>
      </form>
      <a href="index.html" class="admin-back">&larr; Voltar ao site</a>
    </div>
  </section>

</div>

<script src="js/booking-config.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
